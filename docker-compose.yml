services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vts}
      POSTGRES_DB: ${DB_NAME:-vts}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vts} -d ${DB_NAME:-vts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vts_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: vts_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-vts}
      DB_PASSWORD: ${DB_PASSWORD:-vts}
      DB_NAME: ${DB_NAME:-vts}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      DB_MIGRATIONS_RUN: "false"
      DB_SSL: ${DB_SSL:-false}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_prod}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_prod}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-console}
      MERCHANT_LOGO_DIR: ${MERCHANT_LOGO_DIR:-uploads/merchant-logos}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

  postgres_test:
    image: postgis/postgis:16-3.4
    profiles: [test]
    environment:
      POSTGRES_USER: vts
      POSTGRES_PASSWORD: vts
      POSTGRES_DB: vts_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vts -d vts_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis_test:
    image: redis:7-alpine
    profiles: [test]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  uploads: